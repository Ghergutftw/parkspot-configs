server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${infra.postgres.host}:${infra.postgres.port}/messaging_db
    username: ${DB_USERNAME:parkspot}
    password: ${DB_PASSWORD:parkspot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${infra.redis.host}
      port: ${infra.redis.port}
  kafka:
    bootstrap-servers: ${infra.kafka.bootstrap-servers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri must match the "iss" claim embedded in tokens (browser-facing host);
          # jwk-set-uri is fetched server-to-server, so it must use the internal network address.
          issuer-uri: ${parkspot.issuer-uri:http://localhost:9000}
          jwk-set-uri: ${parkspot.internal-issuer-uri:http://localhost:9000}/oauth2/jwks
      client:
        registration:
          messaging-service:
            provider: parkspot-auth
            client-id: messaging-service
            client-secret: ${MESSAGING_SERVICE_CLIENT_SECRET:local-only-messaging-service-secret}
            authorization-grant-type: client_credentials
            scope: internal
        provider:
          parkspot-auth:
            # token-uri is called server-to-server, so use the internal network address directly
            # (avoids OIDC discovery against issuer-uri, which is browser-facing and unreachable
            # from inside another service's container).
            token-uri: ${parkspot.internal-issuer-uri:http://localhost:9000}/oauth2/token

aws:
  s3:
    region: ${infra.s3.region}
    access-key: ${infra.s3.access-key:}
    secret-key: ${infra.s3.secret-key:}
    bucket: ${infra.s3.bucket}
